name: Mer de nuages — mise à jour

on:
  schedule:
    # passages VIIRS au-dessus de Grenoble : ~11 h - 13 h 30 UTC (données dispo ~30-60 min après)
    - cron: "17 12,13,14,15 * * *"
    # prévision AROME le reste de la journée
    - cron: "43 0,4,8,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache MNT
        uses: actions/cache@v4
        with:
          path: dem_grenoble_20m.npy
          key: dem-v1
      - name: Pipeline
        run: |
          [ -f web/data/relief.png ] || python3 pipeline.py statique
          H=$(date -u +%H)
          if [ "$H" -ge 11 ] && [ "$H" -le 16 ]; then
            python3 pipeline.py viirs "$(date -u +%Y/%m/%d)" || true
            python3 pipeline.py s2 5 || true
          fi
          python3 pipeline.py arome || true
          python3 pipeline.py index
      - name: Commit des données
        run: |
          git config user.name "mer2nuages-bot"
          git config user.email "mer2nuages-bot@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "Données $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
