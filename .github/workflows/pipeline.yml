name: Mer de nuages — mise à jour

on:
  schedule:
    # toutes les heures : MTG (visible le jour, infrarouge la nuit, images toutes les 30 min traitées par lot),
    # AROME, observations Météo-France ; VIIRS et Sentinel-2 vers midi
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache MNT
        uses: actions/cache@v4
        with:
          path: dem_zone_v2_20m.npy
          key: dem-v2
      - name: Pipeline
        env:
          EUMETSAT_CONSUMER_KEY: ${{ secrets.EUMETSAT_CONSUMER_KEY }}
          EUMETSAT_CONSUMER_SECRET: ${{ secrets.EUMETSAT_CONSUMER_SECRET }}
          WINDY_WEBCAMS_API_KEY: ${{ secrets.WINDY_WEBCAMS_API_KEY }}
          MF_OBS_API_KEY: ${{ secrets.MF_OBS_API_KEY }}
        run: |
          [ -f web/data/relief.png ] || python3 pipeline.py statique
          H=$(date -u +%H)
          python3 pipeline.py mtg || true
          if [ "$H" -ge 11 ] && [ "$H" -le 16 ]; then
            python3 pipeline.py viirs "$(date -u +%Y/%m/%d)" || true
            python3 pipeline.py s2 5 || true
          fi
          python3 pipeline.py arome || true
          python3 pipeline.py vent || true
          python3 -c "import pipeline; pipeline.run_webcams()" || true
          python3 pipeline.py obs || true
          python3 pipeline.py index
      - name: Commit des données
        run: |
          git config user.name "mer2nuages-bot"
          git config user.email "mer2nuages-bot@users.noreply.github.com"
          git add web/data
          git diff --cached --quiet || git commit -m "Données $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
